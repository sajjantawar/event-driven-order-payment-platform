spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/payments}
    username: ${DB_USERNAME:payments}
    password: ${DB_PASSWORD:payments}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8083}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics