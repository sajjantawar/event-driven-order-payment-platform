name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository foundation
        run: |
          test -f README.md
          test -f docs/architecture.md
          test -f docs/event-flow.md
          echo "Repository foundation is valid."
